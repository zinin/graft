name: ci

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # Formatting does not depend on the system.
      - if: runner.os == 'Linux'
        run: test -z "$(gofmt -l . | tee /dev/stderr)"
      - run: go vet ./...
      - if: runner.os != 'Windows'
        run: go test -race ./...
      # The race detector needs a C compiler on Windows; Linux and macOS
      # catch the races.
      - if: runner.os == 'Windows'
        run: go test ./...
      - run: node --test internal/ui/jstest/draft.test.mjs

  # install.ps1 gets a job here once a release has the Windows archives;
  # until then it is checked by hand against the archives of make dist.
  install:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - if: runner.os == 'Linux'
        run: shellcheck -s sh install.sh
      - run: GRAFT_INSTALL_DIR="$RUNNER_TEMP/bin" sh install.sh
      - run: '"$RUNNER_TEMP/bin/graft" version'
